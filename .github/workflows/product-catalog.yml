name: Build product photo catalog

on:
  push:
    branches: [main]
    paths:
      - "product-cards/originals/**"
      - "product-cards/catalog/build_catalog.py"
      - ".github/workflows/product-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-catalog-main
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate catalog manifest
        run: python product-cards/catalog/build_catalog.py

      - name: Commit catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-cards/catalog/index.json
          if git diff --cached --quiet; then
            echo "Catalog is already up to date."
          else
            git commit -m "Update product photo catalog"
            git push
          fi
