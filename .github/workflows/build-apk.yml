name: Build CardAI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract checkpoint source
        run: |
          unzip -o CardAI_1_4_4_checkpoint.zip -d checkpoint
          test -f checkpoint/CardAI_1_4/android/settings.gradle.kts
          # Android API 37 is not available in the current SDK repository.
          # Compile the prototype against the currently available Android 36 SDK.
          find checkpoint/CardAI_1_4/android -name '*.gradle.kts' -type f -print0 | xargs -0 sed -i -E 's/(compileSdk|targetSdk)[[:space:]]*=[[:space:]]*37/\1 = 36/g'
          # AGP 9 has built-in Kotlin; remove the legacy Android Kotlin plugin from the app module.
          sed -i -E '/org\.jetbrains\.kotlin\.android|libs\.plugins\.kotlin\.android|kotlin\("android"\)/d' checkpoint/CardAI_1_4/android/app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle -p checkpoint/CardAI_1_4/android --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CardAI-debug-apk
          path: checkpoint/CardAI_1_4/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
