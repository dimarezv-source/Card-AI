name: Build CardAI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract checkpoint source
        run: |
          unzip -o CardAI_1_4_4_checkpoint.zip -d checkpoint
          test -f checkpoint/CardAI_1_4/android/settings.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("checkpoint/CardAI_1_4/android")
          gradle_file = root / "app/build.gradle.kts"
          s = gradle_file.read_text()
          s2 = "".join(line for line in s.splitlines(True) if not any(token in line for token in ("org.jetbrains.kotlin.android", "libs.plugins.kotlin.android", 'kotlin("android")')))
          if s2 == s and ("org.jetbrains.kotlin.android" in s or "libs.plugins.kotlin.android" in s):
              raise SystemExit("Kotlin Android plugin still present; refusing to build.")
          gradle_file.write_text(s2)
          main = root / "app/src/main/java/com/cardai/app/MainActivity.kt"
          t = main.read_text()
          t = t.replace("PickMultipleVisualMedia.ImageOnly", "androidx.activity.result.contract.ActivityResultContracts.PickVisualMedia.ImageOnly")
          t = t.replace("PickVisualMedia.ImageOnly", "androidx.activity.result.contract.ActivityResultContracts.PickVisualMedia.ImageOnly")
          t = t.replace("androidx.activity.result.contract.ActivityResultContracts.androidx.activity.result.contract.ActivityResultContracts.PickVisualMedia", "androidx.activity.result.contract.ActivityResultContracts.PickVisualMedia")
          t = t.replace(", Modifier.fillMaxWidth())", ", modifier = Modifier.fillMaxWidth())")
          t = t.replace('if (uploaded == 0) { message = "Не удалось загрузить фотографии"; busy = false; return@launch }',
                        'if (uploaded == 0) { message = uploadResults.firstOrNull()?.message ?: "Не удалось загрузить фотографии"; busy = false; return@launch }')
          # Parse the current backend's /analyze response directly; do not call the
          # legacy /listing-draft endpoint, which the current backend does not provide.
          t = t.replace('            val draftResult = CardAiApi.listingDraft(projectId)\n            draft = draftResult.second\n',
                        '            draft = CardAiApi.listingFromAnalysis(analysis)\n')
          t = t.replace('analysis.ok && analysisStatus == "ready_for_review" && draftResult.first.ok',
                        'analysis.ok && analysisStatus == "completed"')
          # Fail fast if critical patches did not apply; a successful compile alone is not enough.
          if 'draft = CardAiApi.listingFromAnalysis(analysis)' not in t:
              raise SystemExit("Analysis-response patch did not apply to MainActivity.kt")
          if 'draftResult.first.ok' in t:
              raise SystemExit("Legacy listing-draft success condition remains in MainActivity.kt")
          if 'val draftResult = CardAiApi.listingDraft(projectId)' in t:
              raise SystemExit("Legacy listing-draft request remains in MainActivity.kt")
          # Preserve useful API/network errors in the UI instead of hiding them behind a generic message.
          old_error = 'else -> analysis.body?.optString("message")?.takeIf { it.isNotBlank() }'
          new_error = '''else -> analysis.body?.optString("message")?.takeIf { it.isNotBlank() && it != "null" }
                    ?: analysis.body?.optString("detail")?.takeIf { it.isNotBlank() && it != "null" }
                    ?: analysis.message.takeIf { !analysis.ok && it.isNotBlank() }'''
          if old_error not in t:
              raise SystemExit("Could not locate analysis error message branch")
          t = t.replace(old_error, new_error, 1)
          main.write_text(t)
          api = root / "app/src/main/java/com/cardai/app/CardAiApi.kt"
          a = api.read_text()
          if "private const val READ_TIMEOUT = 30_000" not in a:
              raise SystemExit("Expected API read timeout declaration was not found")
          a = a.replace("private const val READ_TIMEOUT = 30_000", "private const val READ_TIMEOUT = 120_000", 1)
          old_catch = '.getOrElse { ApiResult(false, "Не удалось запустить анализ") }'
          new_catch = '.getOrElse { ApiResult(false, "Не удалось запустить анализ: ${it.message ?: it::class.java.simpleName}") }'
          if old_catch not in a:
              raise SystemExit("Could not locate analyze() exception handler")
          a = a.replace(old_catch, new_catch, 1)
          marker = '    suspend fun listingDraft(projectId: String): Pair<ApiResult, ListingDraft> = withContext(Dispatchers.IO) {'
          import textwrap
          method = textwrap.dedent("""\
              fun listingFromAnalysis(result: ApiResult): ListingDraft {
                  val draft = result.body?.optJSONObject("draft") ?: org.json.JSONObject()
                  val chars = mutableMapOf<String, String>()
                  listOf("category", "condition", "price_min", "price_max", "price_reasoning").forEach { key ->
                      val value = draft.optString(key).takeIf { it.isNotBlank() && it != "null" }
                      if (value != null) chars[key] = value
                  }
                  val confirmation = mutableListOf<String>()
                  listOf("missing_info", "photo_tips").forEach { key ->
                      val array = draft.optJSONArray(key)
                      if (array != null) for (i in 0 until array.length()) {
                          val item = array.optString(i).trim()
                          if (item.isNotEmpty()) confirmation += item
                      }
                  }
                  val items = draft.optJSONArray("detected_items")
                  if (items != null) for (i in 0 until items.length()) {
                      val item = items.optString(i).trim()
                      if (item.isNotEmpty()) chars["Предмет ${i + 1}"] = item
                  }
                  return ListingDraft(
                      title = draft.optString("title").takeIf { it != "null" } ?: "",
                      description = draft.optString("description").takeIf { it != "null" } ?: "",
                      characteristics = chars,
                      needsConfirmation = confirmation,
                      needsReview = true
                  )
              }

          """)
          if marker not in a:
              raise SystemExit("Could not find API insertion point")
          a = a.replace(marker, method + marker)
          api.write_text(a)
          # Verify the method exists exactly once in the source that will be compiled.
          compiled_api = api.read_text()
          if compiled_api.count("fun listingFromAnalysis(result: ApiResult): ListingDraft") != 1:
              raise SystemExit("Expected exactly one listingFromAnalysis implementation")
          # Ensure the APK for a physical phone uses the public Render URL.
          s = gradle_file.read_text()
          old, new = "http://10.0.2.2:8000", "https://card-ai-y2qx.onrender.com"
          if old not in s:
              raise SystemExit("Expected emulator API URL was not found; refusing to build an unpatched APK.")
          gradle_file.write_text(s.replace(old, new))
          print("Configured API URL:", new)
          print("Kotlin Android plugin removal verified.")
          # Emit only the analysis flow and user-facing failure branch to aid diagnosis.
          lines = main.read_text().splitlines()
          needles = ("Фото загружены", "analysisStatus", "listingFromAnalysis", "analyzeProject", "CardAiApi.analyze", "analysis.ok")
          for i, line in enumerate(lines):
              if any(token in line for token in needles):
                  lo, hi = max(0, i - 3), min(len(lines), i + 5)
                  print(f"=== MainActivity.kt lines {lo + 1}-{hi} ===")
                  for n in range(lo, hi):
                      print(f"{n + 1}: {lines[n]}")
          PY
          echo "=== API endpoint configuration ==="
          grep -R -n -E 'CARDAI_API_BASE_URL|baseUrl|BASE_URL|https?://' checkpoint/CardAI_1_4/android --include='*.gradle' --include='*.gradle.kts' --include='*.properties' --include='*.kt' || true

      - name: Upload extracted source for debugging
        uses: actions/upload-artifact@v4
        with:
          name: CardAI-source-debug
          path: checkpoint/CardAI_1_4/android/app/src/main
          if-no-files-found: error
          retention-days: 7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle -p checkpoint/CardAI_1_4/android --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CardAI-debug-apk
          path: checkpoint/CardAI_1_4/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
