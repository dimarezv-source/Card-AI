name: Build CardAI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract checkpoint source
        run: |
          unzip -o CardAI_1_4_4_checkpoint.zip -d checkpoint
          test -f checkpoint/CardAI_1_4/android/settings.gradle.kts
          # AGP 9 includes Kotlin support; remove the legacy Android Kotlin plugin.
          sed -i -E '/org\.jetbrains\.kotlin\.android|libs\.plugins\.kotlin\.android|kotlin\("android"\)/d' checkpoint/CardAI_1_4/android/app/build.gradle.kts
          # Fully qualify the media picker type to avoid a missing import.
          sed -i 's/PickMultipleVisualMedia\.ImageOnly/androidx.activity.result.contract.ActivityResultContracts.PickVisualMedia.ImageOnly/g; s/PickVisualMedia\.ImageOnly/androidx.activity.result.contract.ActivityResultContracts.PickVisualMedia.ImageOnly/g; s#androidx\.activity\.result\.contract\.ActivityResultContracts\.androidx\.activity\.result\.contract\.ActivityResultContracts\.PickVisualMedia#androidx.activity.result.contract.ActivityResultContracts.PickVisualMedia#g; s/, Modifier\.fillMaxWidth())/, modifier = Modifier.fillMaxWidth())/g' checkpoint/CardAI_1_4/android/app/src/main/java/com/cardai/app/MainActivity.kt
          nl -ba checkpoint/CardAI_1_4/android/app/src/main/java/com/cardai/app/MainActivity.kt | sed -n '115,130p'
          # Show the actual first upload error instead of hiding it behind a generic message.
          sed -i 's/message = "Не удалось загрузить фотографии"/message = "Не удалось загрузить фотографии: ${uploadResults.firstOrNull { !it.ok }?.message ?: \\\"неизвестная ошибка\\\"}"/' checkpoint/CardAI_1_4/android/app/src/main/java/com/cardai/app/MainActivity.kt

      - name: Upload extracted source for debugging
        uses: actions/upload-artifact@v4
        with:
          name: CardAI-source-debug
          path: checkpoint/CardAI_1_4/android/app/src/main
          if-no-files-found: error
          retention-days: 7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle -p checkpoint/CardAI_1_4/android --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CardAI-debug-apk
          path: checkpoint/CardAI_1_4/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
